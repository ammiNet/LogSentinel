<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSentinel - User Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1220;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-card {
            width: 400px;
            background-color: #111827;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #22c55e;
        }

        p {
            color: #d1d5db;
        }

        .logout-button {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 25px;
            background-color: #ef4444;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .logout-button:hover {
            background-color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="dashboard-card">
        <h1>Welcome, {{ username }}</h1>
        <p>You are logged in as a standard user.</p> <a href="{{ url_for('logout') }}" class="logout-button"> Logout
        </a>
    </div>
</body>

</html>
