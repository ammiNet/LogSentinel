<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogSentinel - Register</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #0b1220;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-card {
            width: 350px;
            background-color: #111827;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #22c55e;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: 1px solid #374151;
            border-radius: 6px;
            background-color: #1f2937;
            color: white;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background-color: #22c55e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #16a34a;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #22c55e;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-card">

        <h1>Create Account</h1>

        <form method="POST">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                maxlength="50"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                maxlength="128"
                required
            >

            <button type="submit">Register</button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </div>

</body>
</html>
